#
# Project metadata for GreenCrypt.
# This is NOT the distribution packaging (deb/AppImage): it only describes the
# Python package so that `pip install .` can build it and create the console
# scripts. Keep `version` in sync with greencrypt/__init__.py.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "greencrypt"
version = "1.0.0"
description = "AES-256-EAX file & folder encryption tool (CLI + Qt GUI)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [
    { name = "Marco Antonio Romero", email = "marcoromero.dev@gmail.com" },
]
keywords = ["encryption", "aes", "eax", "cryptography", "cli", "qt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security :: Cryptography",
]

# Hard runtime dependency: the AES/PBKDF2 backend.
# We use the `pycryptodomex` distribution (the `Cryptodome` namespace) as the
# primary choice; greencrypt.core also accepts `Crypto` (pycryptodome) and the
# Debian-packaged `python3-pycryptodome` via a small import shim.
dependencies = [
    "pycryptodomex>=3.20",
]

[project.optional-dependencies]
# GUI extra: `pip install 'greencrypt[gui]'`
gui = ["PySide6>=6.5"]

[project.scripts]
# CLI / GUI dispatcher: no args -> GUI, otherwise CLI.
greencrypt = "greencrypt.cli:main"
# Force the graphical front-end.
greencrypt-gui = "greencrypt.gui:main"

[project.urls]
Homepage = "https://github.com/Darkfoe703/GreenCrypt"
Repository = "https://github.com/Darkfoe703/GreenCrypt"
Issues = "https://github.com/Darkfoe703/GreenCrypt/issues"

# ------------------------------------------------------------- dev tooling ---
# PEP 735 dependency groups: tools needed only to hack on GreenCrypt. They are
# NOT installed for end users and are NOT published to PyPI (unlike extras).
#
#   pip install --group dev -e .      # install the project + dev tools (pip >= 25.1)
#
# Rule of thumb: an *extra* ([project.optional-dependencies]) is a runtime
# feature a user chooses (e.g. the GUI); a *dependency group* is build/dev
# tooling. Keep this list to what is actually used.
[dependency-groups]
dev = [
    "build>=1.2",   # `python -m build` -> sdist + wheel (used when packaging)
    "ruff>=0.6",    # linter + formatter (covers flake8 + isort + black)
]
# Only needed to produce distributables (standalone/AppImage). Kept apart from
# `dev` because nobody needs a freezer for day-to-day coding.
package = [
    "pyinstaller>=6.10",   # freeze the app into a self-contained bundle
]

[tool.setuptools.packages.find]
include = ["greencrypt*"]

[tool.setuptools.package-data]
# greencrypt/gui/main_ui.py is generated but committed (see `make ui`), so it
# ships automatically as a normal module. Here we add the UI source and the
# visual assets (PNG/ICO/JPG) that live next to the code.
"greencrypt.gui" = ["main.ui", "assets/*"]

# ------------------------------------------------------------------ ruff -----
[tool.ruff]
target-version = "py310"
line-length = 100
# Regenerated by pyside6-uic -> never lint/format it by hand.
extend-exclude = ["greencrypt/gui/main_ui.py"]

[tool.ruff.lint]
# pycodestyle core errors (E4/E7/E9) + pyflakes (F): unused imports, undefined
# names, etc. E501 (line length) is intentionally left out to avoid noise.
select = ["E4", "E7", "E9", "F"]
