# git-buildpackage (gbp) configuration for GreenCrypt.
#
# Branch layout:
#   master        -> upstream source only (no debian/ directory)
#   debian/latest -> upstream source + debian/ packaging (this branch)
#
# Upstream 1.0.0 is tagged v1.0.0. When the Debian package is released it will
# be tagged debian/1.0.0-1 (see debian-tag below).

[DEFAULT]
debian-branch = debian/latest
upstream-branch = master
upstream-tag = v%(version)s
debian-tag = debian/%(version)s

# No pristine-tar branch yet: `gbp export-orig` builds the orig tarball from
# the upstream tag. Switch to True once you start maintaining that branch.
pristine-tar = False

# Enable once a GPG key is configured and tags start being signed.
# sign-tags = True
# keyid = 0123456789ABCDEF

[buildpackage]
# Keep the exported source tree and the generated .deb/.changes outside the
# repository (standard gbp layout). gbp creates the directory if missing.
export-dir = ../build-area/
